[project]
name = "mealprep"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "pydantic>=2.7", "python-multipart>=0.0.9",
                "psycopg[binary]>=3.2", "pypdfium2>=4.30", "anthropic>=1.13,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "hypothesis>=6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mealprep*"]

[tool.setuptools.package-data]
mealprep = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
